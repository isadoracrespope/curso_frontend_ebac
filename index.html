<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício HTML</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
    <form>
        <label for="user"><b>Usuário:</b></label>
        <input id="user" type="text" /><br />
        <label for="email"><b>E-mail:</b></label>
        <input id="email" type="email" /><br />
        <label for="password" style="color:aqua"><b>Senha:</b></label>
        <input id="password" type="password" /><br />
        <button class="botaoenvio" type="submit">Cadastrar</button>
        <button class="botaoapagar" type="reset">Cancelar</button>
    </form>
</body>
</html>
